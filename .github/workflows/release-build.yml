name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to rebuild, or to publish with publish=true
        required: false
        type: string
      publish:
        description: Publish the built artifacts to Modrinth and CurseForge
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      fca_version: ${{ steps.version.outputs.fca_version }}
      fca_ref: ${{ steps.version.outputs.fca_ref }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_type: ${{ steps.version.outputs.release_type }}
      source_ref: ${{ steps.version.outputs.source_ref }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Read and validate release versions
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          SOURCE_REF: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          fca_version="$(sed -n 's/^fca_version=//p' gradle.properties)"
          source_sha="$(git rev-parse HEAD)"
          release_tag="$REQUESTED_RELEASE_TAG"
          publish="$PUBLISH_INPUT"
          if [[ "$EVENT_NAME" == "release" ]]; then
            publish=true
          fi

          test -n "$version"
          test -n "$fca_version"
          if [[ -n "$release_tag" ]]; then
            [[ "$release_tag" == v* ]] || {
              echo "Release tag must start with v: $release_tag" >&2
              exit 1
            }
            [[ "$release_tag" == "v${version}" ]] || {
              echo "Tag $release_tag does not match mod_version=$version." >&2
              exit 1
            }
          elif [[ "$publish" == "true" ]]; then
            echo "workflow_dispatch publishing requires release_tag." >&2
            exit 1
          fi

          if [[ "$version" == *-alpha* ]]; then
            release_type="alpha"
          elif [[ "$version" == *-beta* || "$version" == *-rc* ||
            "$version" == *-* ]]; then
            release_type="beta"
          else
            release_type="release"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "fca_version=${fca_version}" >> "$GITHUB_OUTPUT"
          echo "fca_ref=v${fca_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${SOURCE_REF}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Preparing TriWasa ${version} against FCA v${fca_version}"

      - name: Validate publishing configuration
        if: github.event_name == 'release' || inputs.publish
        shell: bash
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$MODRINTH_PROJECT_ID" ]] || missing+=("MODRINTH_PROJECT_ID repository variable")
          [[ -n "$CURSEFORGE_PROJECT_ID" ]] || missing+=("CURSEFORGE_PROJECT_ID repository variable")
          [[ -n "$MODRINTH_TOKEN" ]] || missing+=("MODRINTH_TOKEN repository secret")
          [[ -n "$CURSEFORGE_TOKEN" ]] || missing+=("CURSEFORGE_TOKEN repository secret")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing release configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.2"
          - "26.3"
    env:
      MOD_VERSION: ${{ needs.prepare.outputs.version }}
      FCA_VERSION: ${{ needs.prepare.outputs.fca_version }}
      FCA_REF: ${{ needs.prepare.outputs.fca_ref }}
      MC_VERSION: ${{ matrix.minecraft }}

    steps:
      - name: Checkout TriWasa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Checkout matching FCA release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: DaHuaShuoDuo/Frostors-Carpet-Addition
          ref: ${{ needs.prepare.outputs.fca_ref }}
          path: .ci/Frostors-Carpet-Addition

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build matching FCA compile dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fca_root=".ci/Frostors-Carpet-Addition"
          mkdir -p "${fca_root}/libs" "${fca_root}/.ci/carpet" \
            "${fca_root}/.ci/quickshulker" libs
          gh release download "v${MC_VERSION}" \
            --repo gnembon/fabric-carpet \
            --pattern "fabric-carpet-${MC_VERSION}*.jar" \
            --dir "${fca_root}/.ci/carpet" \
            --clobber
          carpet_jar="$(find "${fca_root}/.ci/carpet" -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$carpet_jar"
          cp "$carpet_jar" "${fca_root}/libs/fabric-carpet-${MC_VERSION}.jar"
          quickshulker_version="$(sed -n 's/^[[:space:]]*quickshulker_version=//p' \
            "${fca_root}/versions/${MC_VERSION}/gradle.properties")"
          test -n "$quickshulker_version"
          gh release download "$quickshulker_version" \
            --repo MoRanpcy/quickshulker \
            --pattern "*.jar" \
            --dir "${fca_root}/.ci/quickshulker" \
            --clobber
          quickshulker_jar="$(find "${fca_root}/.ci/quickshulker" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$quickshulker_jar"
          cp "$quickshulker_jar" \
            "${fca_root}/libs/quickshulker-${MC_VERSION}.jar"
          chmod +x "${fca_root}/gradlew"
          (
            cd "$fca_root"
            ./gradlew ":${MC_VERSION}:build" --warning-mode all
          )
          fca_built_version="$(sed -n 's/^[[:space:]]*mod_version=//p' \
            "${fca_root}/gradle.properties")"
          test "$fca_built_version" = "$FCA_VERSION"
          fca_jar="$(find "${fca_root}/versions/${MC_VERSION}/build/libs" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$fca_jar"
          cp "$fca_jar" "libs/frostors-carpet-addition-fabric-${MC_VERSION}-${FCA_VERSION}.jar"

      - name: Build and test TriWasa
        run: ./gradlew ":${MC_VERSION}:build" --warning-mode all

      - name: Verify release artifact
        run: |
          set -euo pipefail
          main_jar="$(find "versions/${MC_VERSION}/build/libs" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$main_jar"
          unzip -p "$main_jar" fabric.mod.json > .ci/fabric.mod.json
          jq -e --arg version "$MOD_VERSION" '
            .environment == "client"
            and .version == $version
            and .depends.malilib != null
            and .depends.litematica != null
            and .suggests["frostors-carpet-addition"] != null
          ' .ci/fabric.mod.json
          if unzip -Z1 "$main_jar" | grep '^top/frostor/carpet/' > /dev/null; then
            echo "::error::FCA classes were bundled into $main_jar"
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$main_jar" release-artifacts/
          echo "Prepared $main_jar"

      - name: Upload release build part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: triwasa-release-part-${{ matrix.minecraft }}
          path: release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release artifact
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download release build parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: triwasa-release-part-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums and build metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FCA_VERSION: ${{ needs.prepare.outputs.fca_version }}
          FCA_REF: ${{ needs.prepare.outputs.fca_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd release-artifacts
          test "$(find . -maxdepth 1 -name '*.jar' | wc -l)" -eq 2
          sha256sum *.jar > SHA256SUMS.txt
          {
            printf 'version=%s\n' "$VERSION"
            printf 'fca_version=%s\n' "$FCA_VERSION"
            printf 'fca_ref=%s\n' "$FCA_REF"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > BUILD-INFO.txt
          cat SHA256SUMS.txt
          cat BUILD-INFO.txt

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: triwasa-${{ needs.prepare.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Minecraft ${{ matrix.minecraft }}
    if: github.event_name == 'release' || inputs.publish
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        minecraft:
          - "26.2"
          - "26.3"
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Download packaged release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: triwasa-${{ needs.prepare.outputs.version }}
          path: release-artifacts

      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          notes="${RELEASE_BODY:-}"
          if [[ -z "$notes" ]]; then
            notes="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json body \
              --jq '.body')"
          fi
          if [[ -z "$notes" ]]; then
            notes="Release ${RELEASE_TAG}."
          fi
          printf '%s\n' "$notes" > .ci/release-notes.md

      - name: Select release JAR
        shell: bash
        env:
          MC_VERSION: ${{ matrix.minecraft }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find release-artifacts -maxdepth 1 -type f \
            -name "*fabric-${MC_VERSION}-${VERSION}.jar" -print)
          if (( ${#jars[@]} != 1 )); then
            printf 'Expected one Minecraft %s release JAR, found %s.\n' \
              "$MC_VERSION" "${#jars[@]}" >&2
            exit 1
          fi
          mkdir -p publish-artifacts
          cp "${jars[0]}" \
            "publish-artifacts/triwasa-${VERSION}-fabric-${MC_VERSION}.jar"

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: publish-artifacts/triwasa-${{ needs.prepare.outputs.version }}-fabric-${{ matrix.minecraft }}.jar
          name: TriWasa ${{ needs.prepare.outputs.version }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ needs.prepare.outputs.version }}+${{ matrix.minecraft }}
          version-type: ${{ needs.prepare.outputs.release_type }}
          changelog-file: .ci/release-notes.md
          loaders: fabric
          environment: "client"
          game-versions: "${{ matrix.minecraft }}"
          game-version-filter: none
          java: "Java 25"
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: fail
