name: Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      fca_version: ${{ steps.version.outputs.fca_version }}
      fca_ref: ${{ steps.version.outputs.fca_ref }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read and validate release versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          fca_version="$(sed -n 's/^fca_version=//p' gradle.properties)"
          source_sha="$(git rev-parse HEAD)"

          test -n "$version"
          test -n "$fca_version"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "fca_version=${fca_version}" >> "$GITHUB_OUTPUT"
          echo "fca_ref=v${fca_version}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Preparing TriWasa ${version} against FCA v${fca_version}"

  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - "26.2"
          - "26.3"
    env:
      MOD_VERSION: ${{ needs.prepare.outputs.version }}
      FCA_VERSION: ${{ needs.prepare.outputs.fca_version }}
      FCA_REF: ${{ needs.prepare.outputs.fca_ref }}
      MC_VERSION: ${{ matrix.minecraft }}

    steps:
      - name: Checkout TriWasa
        uses: actions/checkout@v7

      - name: Checkout matching FCA release
        uses: actions/checkout@v7
        with:
          repository: DaHuaShuoDuo/Frostors-Carpet-Addition
          ref: ${{ needs.prepare.outputs.fca_ref }}
          path: .ci/Frostors-Carpet-Addition

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build matching FCA compile dependency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fca_root=".ci/Frostors-Carpet-Addition"
          mkdir -p "${fca_root}/libs" "${fca_root}/.ci/carpet" libs
          gh release download "v${MC_VERSION}" \
            --repo gnembon/fabric-carpet \
            --pattern "fabric-carpet-${MC_VERSION}*.jar" \
            --dir "${fca_root}/.ci/carpet" \
            --clobber
          carpet_jar="$(find "${fca_root}/.ci/carpet" -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$carpet_jar"
          cp "$carpet_jar" "${fca_root}/libs/fabric-carpet-${MC_VERSION}.jar"
          chmod +x "${fca_root}/gradlew"
          (
            cd "$fca_root"
            ./gradlew ":${MC_VERSION}:build" --warning-mode all
          )
          fca_built_version="$(sed -n 's/^[[:space:]]*mod_version=//p' \
            "${fca_root}/gradle.properties")"
          test "$fca_built_version" = "$FCA_VERSION"
          fca_jar="$(find "${fca_root}/versions/${MC_VERSION}/build/libs" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$fca_jar"
          cp "$fca_jar" "libs/frostors-carpet-addition-fabric-${MC_VERSION}-${FCA_VERSION}.jar"

      - name: Build and test TriWasa
        run: ./gradlew ":${MC_VERSION}:build" --warning-mode all

      - name: Verify release artifact
        run: |
          set -euo pipefail
          main_jar="$(find "versions/${MC_VERSION}/build/libs" \
            -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$main_jar"
          unzip -p "$main_jar" fabric.mod.json > .ci/fabric.mod.json
          jq -e --arg version "$MOD_VERSION" '
            .environment == "client"
            and .version == $version
            and .depends.malilib != null
            and .depends.litematica != null
            and .suggests["frostors-carpet-addition"] != null
          ' .ci/fabric.mod.json
          if unzip -Z1 "$main_jar" | grep '^top/frostor/carpet/' > /dev/null; then
            echo "::error::FCA classes were bundled into $main_jar"
            exit 1
          fi
          mkdir -p release-artifacts
          cp "$main_jar" release-artifacts/
          echo "Prepared $main_jar"

      - name: Upload release build part
        uses: actions/upload-artifact@v7
        with:
          name: triwasa-release-part-${{ matrix.minecraft }}
          path: release-artifacts/*.jar
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release artifact
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download release build parts
        uses: actions/download-artifact@v7
        with:
          pattern: triwasa-release-part-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums and build metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FCA_VERSION: ${{ needs.prepare.outputs.fca_version }}
          FCA_REF: ${{ needs.prepare.outputs.fca_ref }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd release-artifacts
          test "$(find . -maxdepth 1 -name '*.jar' | wc -l)" -eq 2
          sha256sum *.jar > SHA256SUMS.txt
          {
            printf 'version=%s\n' "$VERSION"
            printf 'fca_version=%s\n' "$FCA_VERSION"
            printf 'fca_ref=%s\n' "$FCA_REF"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'workflow_run=%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > BUILD-INFO.txt
          cat SHA256SUMS.txt
          cat BUILD-INFO.txt

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v7
        with:
          name: triwasa-${{ needs.prepare.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
